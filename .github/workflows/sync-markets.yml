name: 同步全球市场数据

on:
  schedule:
    # 每个工作日 UTC 22:30 运行（美股收盘后，北京时间次日 06:30）
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-markets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取全球指数
        run: |
          node --version
          node scripts/fetch_markets.mjs

      - name: 提交更新
        run: |
          git config user.name "markets-sync[bot]"
          git config user.email "markets-sync[bot]@users.noreply.github.com"
          git add data/global-markets.json
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 同步全球市场数据 $(date +'%Y-%m-%d')"
            git push
          fi
