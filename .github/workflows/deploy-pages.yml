name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # 数据同步 workflow 用 GITHUB_TOKEN 推送提交，不会触发 push 部署，这里在同步完成后补一次部署。
  # workflows 匹配的是各 workflow 的 name（改名时记得同步改这里）。
  workflow_run:
    workflows:
      - "同步 Dota 2 数据"
      - "同步豆瓣书影音数据"
      - "同步知乎想法"
      - "同步译制作品数据"
      - "同步女性指标数据"
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时 github.sha/event.workflow_run.head_sha 都可能是同步前的旧提交，
          # 而同步 workflow 已经把新数据 push 到 main，这里统一取 main 最新提交。
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4