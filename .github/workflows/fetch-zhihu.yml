name: 同步知乎想法

on:
  schedule:
    # 每天 UTC 6:00 (北京时间 14:00) 运行
    - cron: '0 6 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取知乎想法
        env:
          # 想法走公开接口，无需凭证；设置 ZHIHU_COOKIE 才会同步文章
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
        run: node scripts/fetch-zhihu.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zhihu.json
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 同步知乎想法"
            git push
          fi