name: 同步知乎想法

on:
  schedule:
    # 每天 UTC 6:00 (北京时间 14:00) 运行
    - cron: '0 6 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装知乎 CLI
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -o "$tmp/skill.zip" \
            https://developer-cdn.zhihu.com/zhihu-cli/releases/stable/skill/zhihu-cli-skill.zip
          unzip -q "$tmp/skill.zip" -d "$tmp"
          bash "$tmp/zhihu/scripts/setup.sh"

      - name: 抓取知乎想法与文章
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: node scripts/fetch-zhihu.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zhihu.json
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 同步知乎想法"
            git push
          fi